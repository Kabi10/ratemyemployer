version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "Kabi10"
    labels:
      - "dependencies"
    versioning-strategy: increase
    groups:
      dependencies:
        patterns:
          - "*"
    target-branch: "develop"
    open-pull-requests-limit: 3
