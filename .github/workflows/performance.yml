name: Performance Monitoring

# Schedule paused: daily runs failed (missing PRODUCTION_URL / lighthouse config).
# Re-enable cron after secrets and .github/lighthouse/config.json are verified.
on:
  workflow_dispatch:

concurrency:
  group: performance-monitoring
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Require production URL
      run: |
        if [ -z "${{ secrets.PRODUCTION_URL }}" ]; then
          echo "::error::PRODUCTION_URL secret is not set"
          exit 1
        fi

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          ${{ secrets.PRODUCTION_URL }}
          ${{ secrets.PRODUCTION_URL }}/companies
          ${{ secrets.PRODUCTION_URL }}/reviews
        uploadArtifacts: true
        temporaryPublicStorage: true
        configPath: './.github/lighthouse/config.json'

    - name: Save results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: '.lighthouseci'
        retention-days: 7

  bundle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build with bundle analysis
      run: ANALYZE=true npm run build

    - name: Upload bundle analysis
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: '.next/analyze'
        retention-days: 7
