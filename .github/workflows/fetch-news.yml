name: Fetch Company News

# Schedule paused until API + secrets are verified (was failing twice daily).
# Fix applied: use fetchCompanyNews + storeNewsArticles (fetchAndStoreCompanyNews does not exist).
on:
  workflow_dispatch:

concurrency:
  group: fetch-company-news
  cancel-in-progress: true

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secrets"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create fetch-news script
        run: |
          mkdir -p scripts
          cat > scripts/fetch-news.ts << 'EOL'
          import { createClient } from '@supabase/supabase-js';
          import { fetchCompanyNews, storeNewsArticles } from '../src/lib/newsApi';

          async function main() {
            if (!process.env.SUPABASE_URL || !process.env.SUPABASE_SERVICE_ROLE_KEY) {
              throw new Error('Missing Supabase credentials');
            }

            const supabase = createClient(
              process.env.SUPABASE_URL,
              process.env.SUPABASE_SERVICE_ROLE_KEY
            );

            try {
              const { data: companies, error } = await supabase
                .from('companies')
                .select('name, average_rating')
                .order('average_rating', { ascending: true })
                .limit(10);

              if (error) throw error;

              if (!companies || companies.length === 0) {
                console.log('No companies found');
                return;
              }

              console.log(`Fetching news for ${companies.length} companies...`);

              let anySuccess = false;
              for (const company of companies) {
                const articles = await fetchCompanyNews(company.name);
                if (articles.length === 0) {
                  console.log(`No articles for ${company.name}`);
                  continue;
                }
                const ok = await storeNewsArticles(company.name, articles);
                console.log(`${company.name}: ${articles.length} articles, store=${ok}`);
                if (ok) anySuccess = true;
              }

              if (!anySuccess) {
                throw new Error('Failed to fetch or store news for any company');
              }
              console.log('Successfully fetched and stored news');
            } catch (error) {
              console.error('Error:', error);
              process.exit(1);
            }
          }

          main();
          EOL

      - name: Run news fetcher
        run: npx ts-node scripts/fetch-news.ts
